name: Validate formulae

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install-awss:
    # Test the public tap after publication, not an unmerged PR formula.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Install and test the published awss formula
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install juthrbog/tap/awss
          brew test juthrbog/tap/awss
          awss --version
          prefix="$(brew --prefix awss)"
          test -s "$prefix/etc/bash_completion.d/awss"
          test -s "$prefix/share/zsh/site-functions/_awss"
          test -s "$prefix/share/fish/vendor_completions.d/awss.fish"

  install-spotui:
    # Test the public tap after publication, not an unmerged PR formula.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the published spotui formula
        shell: bash
        run: |
          if [[ ! -f Formula/spotui.rb ]]; then
            echo 'No spotui formula yet; awaiting the first stable release.'
            exit 0
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            # The Linux binary uses the ALSA library of the system, like on
            # a desktop.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libasound2t64
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install juthrbog/tap/spotui
          brew test juthrbog/tap/spotui
          spotui -version

  install-lazycloud:
    # Test the public tap after publication, not an unmerged PR formula.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the published lazycloud formula
        shell: bash
        run: |
          if [[ ! -f Formula/lazycloud.rb ]]; then
            echo 'No lazycloud formula yet; awaiting the next stable release.'
            exit 0
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install juthrbog/tap/lazycloud
          brew test juthrbog/tap/lazycloud
          lazycloud --version

  install-lazybw:
    # Test the public tap after publication, not an unmerged PR formula.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the published lazybw formula
        shell: bash
        run: |
          if [[ ! -f Formula/lazybw.rb ]]; then
            echo 'No lazybw formula yet; awaiting the next stable release.'
            exit 0
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew install juthrbog/tap/lazybw
          brew test juthrbog/tap/lazybw
          lazybw --version

  install-reeltty:
    # Test the public tap after publication, not an unmerged PR formula.
    # The formula is for Linux only: reeltty uses /dev/shm and the system libmpv.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test the published reeltty formula
        shell: bash
        run: |
          if [[ ! -f Formula/reeltty.rb ]]; then
            echo 'No reeltty formula yet; awaiting the first stable release.'
            exit 0
          fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install juthrbog/tap/reeltty
          brew test juthrbog/tap/reeltty
          reeltty --version

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Ruby syntax without executing formulae
        shell: bash
        run: |
          shopt -s nullglob
          formulae=(Formula/*.rb)
          if [[ ${#formulae[@]} -eq 0 ]]; then
            echo 'No formulae yet; awaiting the first stable release.'
          fi
          for formula in "${formulae[@]}"; do
            ruby -c "$formula"
          done
